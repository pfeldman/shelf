<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e2a27"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Shelf icon: book spines on a shelf -->
  <g transform="translate(256,256)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shelf plank -->
    <line x1="-108" y1="75" x2="108" y2="75" stroke="#e07a5f" stroke-width="13"/>
    <!-- Books standing on shelf -->
    <rect x="-92" y="-64" width="32" height="139" rx="5" fill="none" stroke="#e07a5f" stroke-width="10"/>
    <rect x="-49" y="-43" width="27" height="118" rx="5" fill="none" stroke="#e07a5f" stroke-width="10" opacity="0.7"/>
    <rect x="-11" y="-75" width="38" height="150" rx="5" fill="none" stroke="#e07a5f" stroke-width="10"/>
    <!-- Leaning book -->
    <rect x="42" y="-54" width="30" height="129" rx="5" fill="none" stroke="#e07a5f" stroke-width="10" opacity="0.7" transform="rotate(8, 57, 10)"/>
    <!-- Small decorative object -->
    <circle cx="92" cy="54" r="14" fill="none" stroke="#e07a5f" stroke-width="8" opacity="0.5"/>
  </g>
</svg>
