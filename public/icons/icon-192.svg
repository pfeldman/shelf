<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e2a27"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <!-- Shelf icon: book spines on a shelf -->
  <g transform="translate(96,96)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shelf plank -->
    <line x1="-40" y1="28" x2="40" y2="28" stroke="#e07a5f" stroke-width="5"/>
    <!-- Books standing on shelf -->
    <rect x="-34" y="-24" width="12" height="52" rx="2" fill="none" stroke="#e07a5f" stroke-width="4"/>
    <rect x="-18" y="-16" width="10" height="44" rx="2" fill="none" stroke="#e07a5f" stroke-width="4" opacity="0.7"/>
    <rect x="-4" y="-28" width="14" height="56" rx="2" fill="none" stroke="#e07a5f" stroke-width="4"/>
    <!-- Leaning book -->
    <rect x="16" y="-20" width="11" height="48" rx="2" fill="none" stroke="#e07a5f" stroke-width="4" opacity="0.7" transform="rotate(8, 21, 4)"/>
    <!-- Small decorative object -->
    <circle cx="34" cy="20" r="5" fill="none" stroke="#e07a5f" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
