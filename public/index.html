<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1814">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shelf">
  <title>Shelf</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" aria-live="polite"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://fqelzbjdseukdujnxeqg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxZWx6Ympkc2V1a2R1am54ZXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzgxMjgsImV4cCI6MjA4ODA1NDEyOH0.ZMa1JDS8OM3VUhEedRIMsoU2iHbbWuzF_yNVQjjON5Q';

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    (async () => {
      let { data: { session } } = await sb.auth.getSession();

      // Retry once after short delay (session may still be initializing)
      if (!session) {
        await new Promise(r => setTimeout(r, 500));
        ({ data: { session } } = await sb.auth.getSession());
      }

      if (!session) {
        // Avoid redirect loop: only redirect if not already coming from login
        if (!document.referrer.includes('login.html')) {
          window.location.href = '/login.html';
        }
        return;
      }

      // Load app.js and boot it with supabase client
      const script = document.createElement('script');
      script.src = 'app.js';
      script.onload = () => bootApp(sb);
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
