name: Process Video Link

on:
  workflow_dispatch:
    inputs:
      link_id:
        description: 'MongoDB Link document ID to process'
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No pip cache here on purpose: it needs a requirements.txt, and
          # pinning yt-dlp is worse than reinstalling it, since a stale version
          # stops being able to read Instagram and Facebook.

      # Needed to extract the audio track before transcribing it. Preinstalled
      # on ubuntu-latest, so this is a cheap guard rather than a real install.
      - name: Ensure ffmpeg
        run: ffmpeg -version > /dev/null 2>&1 || sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install yt-dlp pymongo dnspython openai faster-whisper

      # The Whisper weights are ~150MB and otherwise get pulled on every run.
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Process video
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/process_video.py "${{ inputs.link_id }}"
